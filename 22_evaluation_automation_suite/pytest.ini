[pytest]
testpaths = .
python_files = test_*.py
python_functions = test_*
addopts = -ra --strict-markers

markers =
    smoke: fast checks of essential chatbot behaviour
    critical: release-blocking business and verification rules
    safety: privacy, role-boundary and unsupported-action checks
    regression: complete evaluation regression suite
    semantic: LLM-judge evaluation that may use API calls
    deterministic: repeatable Python rule checks without an LLM judge
    diagnostic: non-blocking evaluator diagnostics